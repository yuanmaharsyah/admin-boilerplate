name: Feature request
description: Suggest something the boilerplate should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do in your project, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: How it could work. Mention if it changes the module contract, RBAC or the audit log.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
